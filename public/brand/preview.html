<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>宁屏 · 品牌图标预览</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f3f6f5; color: #142d2a; font-family: system-ui, sans-serif; }
      main { max-width: 1000px; margin: auto; padding: 64px 24px; }
      .eyebrow { color: #0f766e; font-size: 12px; letter-spacing: .16em; font-weight: 700; }
      h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.04em; margin: 12px 0 16px; }
      .intro { max-width: 640px; color: #4b625e; line-height: 1.8; }
      .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 36px 0 20px; }
      .panel { min-height: 300px; border-radius: 24px; background: white; padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
      .dark { background: #102c29; color: #f1f8f6; }
      .wordmark { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; }
      .sizes { background: white; border-radius: 24px; padding: 32px; }
      h2 { font-size: 16px; margin: 0 0 24px; }
      .samples { display: flex; align-items: end; gap: 32px; flex-wrap: wrap; }
      figure { margin: 0; display: grid; justify-items: center; gap: 16px; }
      figcaption { color: #4b625e; font-size: 12px; }
      img { display: block; }
      .note { color: #4b625e; font-size: 14px; line-height: 1.8; }
      a { color: #0f766e; text-underline-offset: 4px; display: inline-block; padding-block: 12px; }
      a:focus-visible { outline: 3px solid #0f766e; outline-offset: 4px; }
      @media (max-width: 600px) { main { padding: 32px 20px; } .panels { grid-template-columns: 1fr; } .panel { min-height: 260px; } .samples { gap: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">NULLPRIVATE / 品牌图标</p>
      <h1>N · 隐私之窗</h1>
      <p class="intro">一块安静的屏幕，一个属于你的空间。以 NullPrivate 的 N 为记忆点，让柔和的圆角与清晰的边界共同表达宁屏的隐私守护。</p>
      <div class="panels">
        <section class="panel" aria-label="浅色背景">
          <img src="../favicon.svg" width="128" height="128" alt="宁屏品牌图标：深青绿圆角屏幕中的白色 N">
          <div class="wordmark"><img src="../favicon.svg" width="32" height="32" alt="">宁屏</div>
        </section>
        <section class="panel dark" aria-label="深色背景">
          <img src="../favicon.svg" width="128" height="128" alt="深色背景下的宁屏图标">
          <div class="wordmark"><img src="../favicon.svg" width="32" height="32" alt="">宁屏</div>
        </section>
      </div>
      <section class="sizes" aria-labelledby="sizes-title">
        <h2 id="sizes-title">实际尺寸 · 从浏览器标签到品牌展示</h2>
        <div class="samples">
          <figure><img src="../favicon.svg" width="16" height="16" alt="16 像素图标"><figcaption>16px</figcaption></figure>
          <figure><img src="../favicon.svg" width="24" height="24" alt="24 像素图标"><figcaption>24px</figcaption></figure>
          <figure><img src="../favicon.svg" width="32" height="32" alt="32 像素图标"><figcaption>32px</figcaption></figure>
          <figure><img src="../favicon.svg" width="48" height="48" alt="48 像素图标"><figcaption>48px</figcaption></figure>
          <figure><img src="../favicon.svg" width="64" height="64" alt="64 像素图标"><figcaption>64px</figcaption></figure>
        </div>
      </section>
      <p class="note">深青绿 #0F766E · 纯白 #FFFFFF · 64 × 64 矢量画布 · 共用同一份 SVG</p>
      <a href="../favicon.svg" download="ningping-icon.svg">下载 SVG 图标</a>
    </main>
  </body>
</html>
